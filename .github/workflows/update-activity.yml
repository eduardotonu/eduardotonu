name: Update recent activity

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh activity block in both READMEs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;

            const { data } = await github.rest.repos.listForUser({
              username: owner,
              type: 'owner',
              sort: 'pushed',
              per_page: 20,
            });

            const repos = data
              .filter(r => !r.fork && !r.archived && r.name !== owner)
              .slice(0, 4);

            const build = (empty, noDesc, updated) =>
              repos.length === 0
                ? `- ${empty}`
                : repos
                    .map(r => `- [\`${r.name}\`](${r.html_url}): ${r.description ?? noDesc} _(${updated} ${r.pushed_at.slice(0, 10)})_`)
                    .join('\n');

            const targets = [
              { file: 'README.md',    block: build('Fresh repos coming soon.', 'no description yet', 'updated') },
              { file: 'README.pt.md', block: build('Repositórios novos em breve.', 'sem descrição ainda', 'atualizado') },
            ];

            for (const { file, block } of targets) {
              if (!fs.existsSync(file)) continue;
              const md = fs.readFileSync(file, 'utf8');
              const out = md.replace(
                /<!--ACTIVITY:START-->[\s\S]*?<!--ACTIVITY:END-->/,
                `<!--ACTIVITY:START-->\n${block}\n<!--ACTIVITY:END-->`
              );
              fs.writeFileSync(file, out);
            }

      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.pt.md
            git commit -m "chore: refresh recent activity"
            git push
          fi
